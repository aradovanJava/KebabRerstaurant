<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adding new meal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #231210;
            --bg-deep: #1a0c0a;
            --surface: rgba(255, 255, 255, 0.055);
            --surface-hover: rgba(255, 255, 255, 0.09);
            --border: rgba(255, 235, 215, 0.14);
            --border-strong: rgba(255, 235, 215, 0.3);
            --text: #fff6ee;
            --text-muted: #c9ab98;
            --red: #d4142c;
            --red-hover: #e8203a;
            --amber: #f2b01e;
            --error: #ff8a80;
            --radius-field: 14px;
            --radius-pill: 999px;
            --font: "Figtree", "Google Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { color-scheme: dark; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.5;
            color: var(--text);
            background:
                    radial-gradient(900px 500px at 105% -10%, rgba(176, 82, 32, 0.35), transparent 60%),
                    radial-gradient(700px 420px at -10% 110%, rgba(212, 20, 44, 0.12), transparent 60%),
                    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            background-attachment: fixed;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 24px 64px;
        }

        /* ---------- Header ---------- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px 8px 12px;
            margin-bottom: 28px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            transition: background .15s, color .15s;
        }
        .back-link:hover { background: var(--surface-hover); color: var(--text); }
        .back-link svg { width: 16px; height: 16px; }

        .eyebrow {
            margin: 0 0 6px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--amber);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(34px, 6vw, 52px);
            line-height: 1.05;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .lead {
            margin: 0 0 32px;
            max-width: 52ch;
            color: var(--text-muted);
        }

        /* ---------- Form card ---------- */
        form {
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px 20px;
        }
        .full { grid-column: 1 / -1; }

        .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

        label, .legend {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .hint {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 13px 16px;
            font: inherit;
            color: var(--text);
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--border);
            border-radius: var(--radius-field);
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        textarea { min-height: 120px; resize: vertical; line-height: 1.5; }

        input::placeholder,
        textarea::placeholder { color: rgba(201, 171, 152, 0.55); }

        input:hover, textarea:hover { border-color: var(--border-strong); }

        input:focus-visible,
        textarea:focus-visible {
            outline: none;
            border-color: var(--amber);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(242, 176, 30, 0.25);
        }

        /* Number inputs with a unit suffix */
        .input-unit { position: relative; }
        .input-unit input { padding-right: 56px; }
        .input-unit .unit {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            pointer-events: none;
        }

        input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .error {
            margin: 0;
            font-size: 13px;
            color: var(--error);
        }

        /* ---------- Allergen chips ---------- */
        fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
        .legend { padding: 0; margin-bottom: 4px; }

        /*
        .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

        }
        .chip input:focus-visible + span {

            outline-offset: 3px;
        }

         */

        /* ---------- Actions ---------- */
        .actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 28px;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .15s, border-color .15s, transform .1s;
        }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

        .btn-primary { color: #fff; background: var(--red); box-shadow: 0 6px 20px rgba(212, 20, 44, 0.35); }
        .btn-primary:hover { background: var(--red-hover); }

        .btn-ghost { color: var(--text); background: var(--surface); border-color: var(--border); }
        .btn-ghost:hover { background: var(--surface-hover); border-color: var(--border-strong); }

        /* ---------- Small screens ---------- */
        @media (max-width: 600px) {
            .page { padding: 24px 16px 48px; }
            form { padding: 22px 18px; border-radius: 20px; }
            .grid { grid-template-columns: 1fr; }
            .actions { flex-direction: column-reverse; align-items: stretch; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<main class="page">
    <a class="back-link" th:href="@{/menu}" href="/menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to menu
    </a>

    <p class="eyebrow">Administrator</p>
    <h1>Add a new meal</h1>
    <p class="lead">Fill in the details below. The meal will appear on the menu as soon as you save it.</p>

    <form th:action="@{/menu/new-meal}" th:object="${mealForm}" method="post">
        <div class="grid">

            <input type="hidden" id="id" th:field="*{id}">

            <div class="field full">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g. Chicken doner wrap" required />
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="field full">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" placeholder="What's in it and how is it served?"></textarea>
                <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <div class="field">
                <label for="price">Price</label>
                <div class="input-unit">
                    <input type="number" id="price" th:field="*{price}" placeholder="0.00" step="0.01" min="0" required />
                    <span class="unit">EUR</span>
                </div>
                <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
            </div>

            <div class="field">
                <label for="normative">Normative</label>
                <div class="input-unit">
                    <input type="number" id="normative" th:field="*{normative}" placeholder="0" min="0" />
                    <span class="unit">g</span>
                </div>
                <p class="error" th:if="${#fields.hasErrors('normative')}" th:errors="*{normative}"></p>
            </div>

            <fieldset>
                <legend>Allergens</legend>
                <span>Select everything this meal contains.</span>
                <div>
                    <label th:each="al : ${mealForm.allergen}">
                        <input type="checkbox" th:field="*{selectedAllergen}" th:value="${al}" />
                        <span th:text="${al}">Allergen</span>
                    </label>
                </div>
            </fieldset>

        </div>

        <div class="actions">
            <a class="btn btn-ghost" th:href="@{/menu}" href="/menu">Cancel</a>
            <button type="submit" class="btn btn-primary">
                    <span th:if="${mealForm.id == null}">Add to menu</span>
                    <span th:unless="${mealForm.id == null}">Update meal</span>
            </button>
        </div>
    </form>
</main>

</body>
</html>
